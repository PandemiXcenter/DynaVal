[project]
name = "dynaval"
version = "0.1.0"
description = "A local NiceGUI desktop app for correcting datasets against source images."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "nicegui>=3.16.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.7",
    "pydantic>=2.13.5",
    "pywebview>=6.2.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.2",
]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
